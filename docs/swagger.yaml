basePath: /
definitions:
  auth.CheckEmployeeRequest:
    properties:
      employee_no:
        type: string
    required:
    - employee_no
    type: object
  auth.CheckEmployeeResponse:
    properties:
      employee:
        $ref: '#/definitions/auth.EmployeeInfo'
      status:
        $ref: '#/definitions/auth.CheckEmployeeStatus'
    type: object
  auth.CheckEmployeeStatus:
    enum:
    - NOT_FOUND
    - REGISTER
    - LOGIN
    type: string
    x-enum-varnames:
    - CheckEmployeeStatusNotFound
    - CheckEmployeeStatusRegister
    - CheckEmployeeStatusLogin
  auth.EmployeeInfo:
    properties:
      employee_no:
        type: string
      name:
        type: string
      position:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      employee_no:
        type: string
      password:
        type: string
    required:
    - employee_no
    - password
    type: object
  auth.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.RegisterRequest:
    properties:
      confirm_password:
        minLength: 8
        type: string
      employee_no:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - confirm_password
    - employee_no
    - password
    type: object
  auth.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
host: localhost:8060
info:
  contact: {}
  description: Authentication and Authorization Service API
  title: Auth Service API
  version: "1.0"
paths:
  /auth/check-employee:
    post:
      consumes:
      - application/json
      description: Check whether employee exists and whether the employee already
        has an account
      parameters:
      - description: Employee number
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.CheckEmployeeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.CheckEmployeeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Check employee
      tags:
      - Authentication
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login using employee number and password
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Login
      tags:
      - Authentication
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke the current refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Logout
      tags:
      - Authentication
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Generate a new access token and refresh token using a valid refresh
        token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Refresh access token
      tags:
      - Authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user using a valid employee number
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Register user
      tags:
      - Authentication
swagger: "2.0"
